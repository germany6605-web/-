<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Gate Runner 3D</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; overflow:hidden; font-family:'Segoe UI',Arial,sans-serif; color:#fff; }
#c { position:fixed; inset:0; }

#hud { position:fixed; inset:0; pointer-events:none; }
#tophud { display:flex; justify-content:space-between; padding:14px 20px; }
#tleft  { font-size:14px; line-height:2; }
#wep-area { text-align:right; }
#wep-name { font-size:22px; font-weight:bold; color:#FFD700; text-shadow:0 0 10px rgba(255,215,0,.5); }
#dmg-d    { font-size:13px; color:#aaa; margin-top:2px; }

#effect-pop { position:absolute; top:38%; left:50%; transform:translate(-50%,-50%);
    font-size:42px; font-weight:bold; text-shadow:0 0 20px currentColor;
    opacity:0; pointer-events:none; transition:opacity .08s; }
#arrow-hint { position:absolute; bottom:22px; left:50%; transform:translateX(-50%);
    font-size:12px; color:rgba(255,255,255,.45); text-align:center; }

.ov { position:fixed; inset:0; display:none; flex-direction:column; align-items:center;
    justify-content:center; background:rgba(0,0,0,.88); z-index:20; overflow-y:auto; padding:20px 0; }
.ov.vis { display:flex; }
.ov h1 { font-size:50px; font-weight:bold; color:#FFD700; margin-bottom:8px;
    text-shadow:0 0 22px rgba(255,215,0,.4); }
.ov p  { font-size:16px; color:#aaa; text-align:center; line-height:1.8; margin-bottom:20px; }
.btn { padding:12px 36px; font-size:18px; font-weight:bold; background:#1a5c1a;
    border:2px solid #4CAF50; color:#fff; border-radius:8px; cursor:pointer; margin:6px; }
.btn:hover { background:#267a26; }
.btn-g { background:#4a3500; border-color:#FFD700; }
.btn-g:hover { background:#6a4d00; }
.btn-g:disabled { background:#111; border-color:#333; color:#444; cursor:not-allowed; }
#shop-coins { font-size:19px; color:#FFD700; margin-bottom:12px; }

/* Shop tabs */
.tab-bar { display:flex; gap:8px; margin-bottom:16px; }
.tab-btn { padding:9px 28px; font-size:15px; font-weight:bold; border-radius:8px 8px 0 0;
    border:2px solid #334; border-bottom:none; background:#0a1020; color:#888; cursor:pointer; }
.tab-btn.active { background:#152040; color:#FFD700; border-color:#FFD700; }
.tab-pane { display:none; }
.tab-pane.active { display:block; }

.sgrid { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-bottom:16px;
    padding:14px; background:#0a1020; border:2px solid #334; border-radius:0 8px 8px 8px; min-width:600px; }
.scard { background:rgba(15,30,60,.97); border:2px solid #334; border-radius:10px; padding:14px;
    width:170px; text-align:center; }
.scard.ok { border-color:#FFD700; }
.scard.active-wep { border-color:#00FF88; }
.scard h3 { font-size:13px; color:#FFD700; margin-bottom:5px; }
.scard p  { font-size:11px; color:#aaa; line-height:1.5; margin-bottom:7px; }
.cost { font-size:13px; color:#FFD700; font-weight:bold; margin-bottom:7px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="tophud">
    <div id="tleft">
      <div id="lv-d" style="color:#FFD700;font-weight:bold">Уровень 1</div>
      <div id="coins-d">🪙 0</div>
    </div>
    <div id="wep-area">
      <div id="wep-name">Пистолет</div>
      <div id="dmg-d">УРН: 1</div>
    </div>
  </div>
  <div id="arrow-hint">◀ A / ← — влево &nbsp;&nbsp; D / → — вправо ▶</div>
  <div id="effect-pop"></div>
</div>

<div class="ov vis" id="start-ov">
  <h1>GATE RUNNER 3D</h1>
  <p>Беги вперёд и выбирай ворота<br>
     Зелёные — улучшают, красные — ухудшают<br>
     A / ← и D / → для выбора направления</p>
  <button class="btn" onclick="startGame()">▶ НАЧАТЬ</button>
</div>
<div class="ov" id="dead-ov">
  <h1 style="color:#FF4444">☠ ИГРА ОКОНЧЕНА</h1>
  <p id="dead-stats"></p>
  <button class="btn" onclick="restartGame()">↺ ЗАНОВО</button>
</div>
<div class="ov" id="shop-ov">
  <h1>★ МАГАЗИН ★</h1>
  <p id="shop-sub"></p>
  <div id="shop-coins">🪙 0</div>
  <div class="tab-bar">
    <button class="tab-btn active" id="tab-upg" onclick="shopTab('upg')">⚡ Улучшения</button>
    <button class="tab-btn"        id="tab-wep" onclick="shopTab('wep')">🔫 Оружие</button>
  </div>
  <div class="tab-pane active" id="pane-upg"><div class="sgrid" id="sgrid-upg"></div></div>
  <div class="tab-pane"        id="pane-wep"><div class="sgrid" id="sgrid-wep"></div></div>
  <button class="btn" onclick="nextLevel()">СЛЕДУЮЩИЙ УРОВЕНЬ ▶</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
'use strict';

// ─── RENDERER ───
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 3));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8DC8E8);
scene.fog = new THREE.FogExp2(0x8DC8E8, 0.016);

const cam = new THREE.PerspectiveCamera(62, 1, 0.1, 200);
scene.add(cam);

function resize(){
    renderer.setSize(innerWidth, innerHeight);
    cam.aspect = innerWidth / innerHeight;
    cam.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// Lights
scene.add(new THREE.HemisphereLight(0x8DC8E8, 0x445533, 0.75));
const sun = new THREE.DirectionalLight(0xFFF0CC, 1.15);
sun.position.set(-8, 20, -10); sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024);
const ssc = sun.shadow.camera;
ssc.near=1; ssc.far=80; ssc.left=ssc.bottom=-25; ssc.right=ssc.top=25;
scene.add(sun);

// ─── CONSTANTS ───
const ROAD_W = 8, ROAD_HALF = ROAD_W/2;
const GATE_SPACING = 20, GATES_PER_LEVEL = 9;
const COMBAT_DIST = GATE_SPACING * GATES_PER_LEVEL + 15;
const FWD_SPEED = 6, X_LIMIT = 3.0, X_ACCEL = 22;

// ─── STATE ───
let GS = 'START', level = 1, coins = 0;
let upgDmg = 0, upgRate = 0;
let px = 0, pz = 0, pvx = 0;
let permDmg = 0, wepLv = 1, spd = FWD_SPEED, coinsX = 1;
let camPx = 0, camPz = -7;
let effPopT = 0;
let winTriggered = false, shopOpened = false;
let bullets = [], runFireT = 0;
let ownedWeapons = new Set([1]), activeWeapon = 1;

// ─── INPUT ───
const keys = {};
addEventListener('keydown', e => {
    keys[e.code]=true;
    if (['ArrowLeft','ArrowRight','KeyA','KeyD','Space'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code]=false; });
// Touch
let touchX0 = null;
canvas.addEventListener('touchstart', e=>{ touchX0=e.touches[0].clientX; e.preventDefault(); },{passive:false});
canvas.addEventListener('touchmove', e=>{
    if (touchX0===null) return;
    const d = e.touches[0].clientX - touchX0;
    keys['ArrowLeft']  = d < -15;
    keys['ArrowRight'] = d >  15;
    e.preventDefault();
},{passive:false});
canvas.addEventListener('touchend', ()=>{ keys['ArrowLeft']=keys['ArrowRight']=false; touchX0=null; });

// ─── ROAD ───
let roadMesh, grassL, grassR;

function makeRoadTex(){
    const cv=document.createElement('canvas'); cv.width=512; cv.height=512;
    const ctx=cv.getContext('2d');
    ctx.fillStyle='#8A8A8A'; ctx.fillRect(0,0,512,512);
    ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,16,512); ctx.fillRect(496,0,16,512);
    ctx.fillStyle='#FFCC00';
    for(let y=0;y<512;y+=80) ctx.fillRect(249,y,14,52);
    const t=new THREE.CanvasTexture(cv);
    t.wrapT=THREE.RepeatWrapping; t.repeat.set(1,28);
    t.anisotropy=renderer.capabilities.getMaxAnisotropy();
    return t;
}

function buildStaticWorld(){
    // Road
    const rMat=new THREE.MeshLambertMaterial({map:makeRoadTex()});
    roadMesh=new THREE.Mesh(new THREE.PlaneGeometry(ROAD_W,600),rMat);
    roadMesh.rotation.x=-Math.PI/2; roadMesh.position.set(0,0,300);
    roadMesh.receiveShadow=true; scene.add(roadMesh);
    // Grass
    const gMat=new THREE.MeshLambertMaterial({color:0x4A7A2A});
    grassL=new THREE.Mesh(new THREE.PlaneGeometry(60,600),gMat);
    grassL.rotation.x=-Math.PI/2; grassL.position.set(-34,-.01,300); scene.add(grassL);
    grassR=grassL.clone(); grassR.position.x=34; scene.add(grassR);
    // Trees
    for(let i=0;i<55;i++){
        const side=Math.random()<.5?-1:1;
        const x=side*(5.5+Math.random()*28), z=8+Math.random()*580;
        addTree(x,z);
    }
}

function addTree(x,z){
    const tM=new THREE.MeshLambertMaterial({color:0x5C3317});
    const lM=new THREE.MeshLambertMaterial({color:0x286020+(Math.random()*0x101010|0)});
    const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.15,.2,1.6,6),tM);
    trunk.position.set(x,.8,z); trunk.castShadow=true; scene.add(trunk);
    const leaves=new THREE.Mesh(new THREE.ConeGeometry(1.1+Math.random()*.5,2.2+Math.random()*.8,7),lM);
    leaves.position.set(x,2.5+Math.random()*.4,z); leaves.castShadow=true; scene.add(leaves);
}

// ─── WEAPONS ───
// shots: number of bullets per fire, spread: angle spread (rad), dmgMult: damage per bullet
// pierce: bullet passes through targets, bScale: bullet size, bColor: bullet colour
const WEPS=[null,
    {name:'Пистолет',  cd:.52, col:0x334455, barrel:.42, grip:.18, wide:.07,
     shots:1, spread:0,    dmgMult:1,  bScale:1.0, bColor:0xFFEE44},
    {name:'Пистолет+', cd:.34, col:0x223344, barrel:.48, grip:.18, wide:.08,
     shots:2, spread:.06,  dmgMult:1,  bScale:0.9, bColor:0xFFCC00},
    {name:'Пулемёт',   cd:.09, col:0x2A3A2A, barrel:.70, grip:.20, wide:.10,
     shots:1, spread:.03,  dmgMult:1,  bScale:0.6, bColor:0xFF8800},
    {name:'Дробовик',  cd:.65, col:0x553322, barrel:.36, grip:.22, wide:.14,
     shots:6, spread:.22,  dmgMult:2,  bScale:1.1, bColor:0xFF3300},
    {name:'Снайперка', cd:.85, col:0x1A2A3A, barrel:.90, grip:.18, wide:.06,
     shots:1, spread:0,    dmgMult:6,  bScale:1.8, bColor:0x44DDFF, pierce:true},
];
const W=()=>WEPS[wepLv];
const effDmg=()=>Math.max(1, 1 + upgDmg + permDmg);
const effCD=()=>W().cd*(.9**upgRate);

// ─── PLAYER MESH (weapon only) ───
let plyGrp, plyWalkT=0, gunFlash=0;

function buildPlayer(){
    if(plyGrp) scene.remove(plyGrp);
    plyGrp=new THREE.Group();
    const wep=W();
    const dark=new THREE.MeshLambertMaterial({color:0x111111});
    const gMat=new THREE.MeshLambertMaterial({color:wep.col});
    const bl=wep.barrel, wd=wep.wide, gp=wep.grip;

    // Barrel (pointing forward along +Z)
    const barrel=new THREE.Mesh(new THREE.BoxGeometry(wd, wd*.65, bl), gMat);
    barrel.position.set(0, 0, bl/2); barrel.castShadow=true; plyGrp.add(barrel);

    // Body/receiver
    const recv=new THREE.Mesh(new THREE.BoxGeometry(wd*1.3, wd*1.1, bl*.45), gMat);
    recv.position.set(0, -wd*.2, bl*.18); recv.castShadow=true; plyGrp.add(recv);

    // Grip
    const grip=new THREE.Mesh(new THREE.BoxGeometry(wd*.8, gp, wd*.9), gMat);
    grip.position.set(0, -wd*.5-gp/2, bl*.1); grip.castShadow=true; plyGrp.add(grip);

    // Trigger guard
    const tg=new THREE.Mesh(new THREE.TorusGeometry(wd*.45, wd*.08, 4, 8, Math.PI),
        dark);
    tg.rotation.x=Math.PI/2; tg.position.set(0, -wd*.55, bl*.18); plyGrp.add(tg);

    // Muzzle
    const muz=new THREE.Mesh(new THREE.CylinderGeometry(wd*.38, wd*.38, wd*.5, 8),
        dark);
    muz.rotation.x=Math.PI/2; muz.position.set(0, 0, bl+wd*.25); plyGrp.add(muz);

    // Scope for sniper
    if(wepLv===5){
        const sc=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,.3,8),dark);
        sc.rotation.x=Math.PI/2; sc.position.set(0,wd*.6,bl*.4); plyGrp.add(sc);
        const sl=new THREE.Mesh(new THREE.CylinderGeometry(.036,.036,.04,8),dark);
        sl.rotation.x=Math.PI/2; sl.position.set(0,wd*.6,bl*.28); plyGrp.add(sl);
        const sr=sl.clone(); sr.position.z=bl*.52; plyGrp.add(sr);
    }
    // Drum for SMG
    if(wepLv===3){
        const dr=new THREE.Mesh(new THREE.CylinderGeometry(.065,.065,.08,12),dark);
        dr.rotation.x=Math.PI/2; dr.position.set(0,-wd*.1,bl*.3); plyGrp.add(dr);
    }
    // Shotgun double barrel
    if(wepLv===4){
        const b2=new THREE.Mesh(new THREE.BoxGeometry(wd*.6,wd*.5,bl*.7),gMat);
        b2.position.set(wd*.9, 0, bl*.35); plyGrp.add(b2);
    }

    // Muzzle flash sphere
    const fl=new THREE.Mesh(new THREE.SphereGeometry(.06,6,4),
        new THREE.MeshBasicMaterial({color:0xFFEE44,transparent:true,opacity:0}));
    fl.position.set(0, 0, bl+wd*.5); fl.userData.flash=true; plyGrp.add(fl);

    plyGrp.scale.setScalar(2.2);
    plyGrp.rotation.x = -0.18;
    scene.add(plyGrp);
}

// ─── BULLETS ───
const BULL_GEO = new THREE.SphereGeometry(.055, 5, 4);
const BULL_MAT = new THREE.MeshBasicMaterial({color:0xFFEE44});
const BULL_SPD = 38;

function fireBulletRun(){
    const w=W();
    for(let i=0;i<w.shots;i++){
        const angle = w.shots>1 ? ((i-(w.shots-1)/2)*w.spread) + (Math.random()-.5)*w.spread*.3 : 0;
        const geo = w.bScale===1.0 ? BULL_GEO : new THREE.SphereGeometry(.055*w.bScale,5,4);
        const mat = new THREE.MeshBasicMaterial({color:w.bColor});
        const b = new THREE.Mesh(geo, mat);
        b.position.set(px+.18, 1.1, pz+.6+w.barrel+.1);
        scene.add(b);
        bullets.push({mesh:b, life:2.5, vx:Math.sin(angle)*BULL_SPD, dmgMult:w.dmgMult, pierce:w.pierce||false});
    }
    gunFlash = .15;
}

function updateBullets(dt){
    for(let i=bullets.length-1; i>=0; i--){
        const b = bullets[i];
        b.mesh.position.z += BULL_SPD * dt;
        if(b.vx) b.mesh.position.x += b.vx * dt;
        b.life -= dt;

        let hit = false;
        const bx=b.mesh.position.x, bz=b.mesh.position.z;

        if(GS==='RUN'){
            for(const gate of gates){
                if(gate.removed || Math.abs(bz - gate.z) > 1.2) continue;
                if(bx < -0.1 && bx > -3.9 && gate.coolL<=0){
                    gate.coolL=0.25; gate.hitsL++;
                    const dyn=updateGatePanel(gate,'L');
                    if(dyn.good) applyEff(dyn);
                    hit=true; break;
                }
                if(bx > 0.1 && bx < 3.9 && gate.coolR<=0){
                    gate.coolR=0.25; gate.hitsR++;
                    const dyn=updateGatePanel(gate,'R');
                    if(dyn.good) applyEff(dyn);
                    hit=true; break;
                }
            }
        }

        // RUN: bullet hits path mobs
        if(GS==='RUN' && !hit){
            for(const m of mobs){
                if(m.dead||m.removed) continue;
                if(Math.abs(bz-m.g.position.z)<0.55 && Math.abs(bx-m.g.position.x)<0.42){
                    m.hp -= effDmg()*(b.dmgMult||1); m.hitT=.12; drawMobHP(m);
                    if(m.hp<=0&&!m.dead){ m.dead=true; coins+=m.reward; refreshHUD(); }
                    if(!b.pierce) hit=true;
                    break;
                }
            }
        }

        // Combat: bullet hits the specific target it flies into
        if(GS==='COMBAT' && !hit){
            for(const e of enemies){
                if(e.dead||e.removed) continue;
                const tx=e.g.position.x, tz=e.g.position.z;
                if(Math.abs(bz-tz)<0.65 && Math.abs(bx-tx)<HEX_R*0.85){
                    e.hp-=effDmg()*(b.dmgMult||1); e.hitT=.1; drawEHP(e); gunFlash=.12;
                    if(e.hp<=0&&!e.dead) killEnemy(e);
                    if(!b.pierce) hit=true;
                    break;
                }
            }
        }

        if(hit || b.life<=0){
            scene.remove(b.mesh);
            bullets.splice(i,1);
        }
    }
}

// ─── GATES ───
let gates=[], gateGrp=new THREE.Group(); scene.add(gateGrp);

const EFFS=[
    {id:'dmg+',  label:'+УРН',      good:true },
    {id:'dmg-',  label:'−УРН',      good:false},
    {id:'money', label:'💵 ДЕНЬГИ', good:true },
    {id:'money', label:'💵 ДЕНЬГИ', good:true },  // doubled weight
    {id:'dmg+',  label:'+УРН',      good:true },  // doubled weight
];

function randomEff(){ return EFFS[Math.floor(Math.random()*EFFS.length)]; }

function effAtCharge(base, charge){
    switch(base.id){
        case 'dmg-':{ const v=-1+charge; return {id:'dmg_val',val:v, label:(v>=0?'+':'')+v+' УРН', good:v>=0}; }
        case 'dmg+':{ const v=2+charge;  return {id:'dmg_val',val:v, label:'+'+v+' УРН', good:true}; }
        default: return base;
    }
}

function makeGateTex(eff){
    const W=512, H=640;
    const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
    const x=cv.getContext('2d');

    if(eff.id==='money'){
        // Paper-money themed panel
        x.fillStyle='#1a6b2a'; x.fillRect(0,0,W,H);
        // Border
        x.strokeStyle='#c8f0a0'; x.lineWidth=14; x.strokeRect(7,7,W-14,H-14);
        x.strokeStyle='rgba(255,255,255,.3)'; x.lineWidth=3; x.strokeRect(22,22,W-44,H-44);
        // Bill rectangles
        const bills=[[60,90,392,160],[60,270,392,160],[60,450,392,120]];
        for(const [bx,by,bw,bh] of bills){
            x.fillStyle='rgba(0,80,0,.35)'; x.fillRect(bx,by,bw,bh);
            x.strokeStyle='#a0e080'; x.lineWidth=3; x.strokeRect(bx,by,bw,bh);
        }
        // $ symbols on bills
        x.font='bold 90px Arial'; x.fillStyle='#c8f0a0';
        x.textAlign='center'; x.textBaseline='middle';
        x.shadowColor='rgba(0,0,0,.6)'; x.shadowBlur=6;
        x.fillText('$', W/2, 170); x.fillText('$', W/2, 350); x.fillText('$', W/2, 510);
        // Label
        x.font='bold 52px Arial'; x.fillStyle='#fff';
        x.fillText('ДЕНЬГИ', W/2, 600);
    } else {
        x.fillStyle=eff.good?'rgba(0,160,60,.95)':'rgba(180,22,15,.95)';
        x.fillRect(0,0,W,H);
        const bc=eff.good?'#00FF88':'#FF4422';
        x.strokeStyle=bc; x.lineWidth=14; x.strokeRect(7,7,W-14,H-14);
        x.strokeStyle='rgba(255,255,255,.3)'; x.lineWidth=4; x.strokeRect(22,22,W-44,H-44);
        x.fillStyle='#fff'; x.textAlign='center'; x.textBaseline='middle';
        x.font=`bold ${eff.label.length>8?76:100}px Arial`;
        x.shadowColor='rgba(0,0,0,.5)'; x.shadowBlur=8;
        x.fillText(eff.label, W/2, H/2);
    }
    const t=new THREE.CanvasTexture(cv);
    t.anisotropy=renderer.capabilities.getMaxAnisotropy();
    return t;
}

const POLE_GEO=new THREE.BoxGeometry(.12,4.4,.12);

function spawnGate(z){
    let eL,eR;
    do{eL=randomEff(); eR=randomEff();}while(eL.id===eR.id);

    const meshes=[];

    const mkPanel=(eff,x)=>{
        const mesh=new THREE.Mesh(
            new THREE.PlaneGeometry(3.6,4.1),
            new THREE.MeshBasicMaterial({map:makeGateTex(eff),transparent:true,side:THREE.DoubleSide})
        );
        mesh.rotation.y=Math.PI;
        mesh.position.set(x,2.05,z); gateGrp.add(mesh); meshes.push(mesh);
        return mesh;
    };
    const pL=mkPanel(effAtCharge(eL,0),-2), pR=mkPanel(effAtCharge(eR,0),2);

    const mkPole=(x,good)=>{
        const m=new THREE.Mesh(POLE_GEO,new THREE.MeshLambertMaterial({color:good?0x00AA44:0xAA2200}));
        m.position.set(x,2.2,z); gateGrp.add(m); meshes.push(m);
    };
    mkPole(-3.9,eL.good); mkPole(-.15,eL.good); mkPole(.15,eR.good); mkPole(3.9,eR.good);

    const mkBar=(x,good)=>{
        const bar=new THREE.Mesh(new THREE.BoxGeometry(3.8,.12,.12),
            new THREE.MeshLambertMaterial({color:good?0x00AA44:0xAA2200}));
        bar.position.set(x,4.35,z); gateGrp.add(bar); meshes.push(bar);
    };
    mkBar(-2,eL.good); mkBar(2,eR.good);

    gates.push({z,eL,eR,pL,pR,meshes, hitsL:0,hitsR:0, coolL:0,coolR:0, passed:false,removed:false});
}

function applyEff(eff){
    switch(eff.id){
        case 'dmg_val': permDmg=Math.max(-upgDmg, permDmg+eff.val); break;
        case 'dmg+': permDmg+=2; break;
        case 'dmg-': permDmg=Math.max(-upgDmg, permDmg-1); break;
        case 'money': coins+=Math.floor(30+level*15); break;
    }
    showEffPop(eff);
    refreshHUD();
}

function updateGatePanel(gate, side){
    const isL = side==='L';
    const hits = isL ? gate.hitsL : gate.hitsR;
    const base = isL ? gate.eL : gate.eR;
    const panel = isL ? gate.pL : gate.pR;
    const dyn = effAtCharge(base, hits);
    panel.material.map.dispose();
    panel.material.map = makeGateTex(dyn);
    panel.material.needsUpdate = true;
    return dyn;
}

function showEffPop(eff){
    effPopT=1.8;
    const el=document.getElementById('effect-pop');
    el.textContent=eff.label;
    el.style.color=eff.good?'#00FF88':'#FF4444';
    el.style.opacity='1';
}

function isNearGate(z){
    for(let i=0;i<GATES_PER_LEVEL;i++){
        if(Math.abs(z-(20+i*GATE_SPACING))<8) return true;

}

function spawnMobs(){

    for(let i=0;i<count;i++){
        let z, tries=0;
        do { z = 12 + Math.random()*(COMBAT_DIST-16); tries++; }

let enemies=[], combatFT=0;

// Fixed footprint radius so columns touch; height grows with row
const HEX_R = 0.92;

function makeTargetTopTex(hp){
    const S=512;
    const cv=document.createElement('canvas'); cv.width=S; cv.height=S;
    const ctx=cv.getContext('2d');
    const cx=S/2, cy=S/2, r=S/2;
    // Gold radial gradient background
    const grad=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
    grad.addColorStop(0,'#FFE066'); grad.addColorStop(0.6,'#FFB800'); grad.addColorStop(1,'#996600');
    ctx.fillStyle=grad; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
    // Concentric rings
    const rings=[{r:r*.88,w:6,c:'rgba(0,0,0,.18)'},{r:r*.65,w:5,c:'rgba(0,0,0,.15)'},{r:r*.40,w:4,c:'rgba(0,0,0,.12)'}];
    for(const rg of rings){
        ctx.beginPath(); ctx.arc(cx,cy,rg.r,0,Math.PI*2);
        ctx.strokeStyle=rg.c; ctx.lineWidth=rg.w; ctx.stroke();
    }
    // Coin symbols
    ctx.font='bold 72px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='rgba(150,90,0,.55)'; ctx.fillText('🪙',cx,cy);
    // HP label
    const label = hp>=1e6 ? (hp/1e6).toFixed(1)+'M' : hp>=1000 ? (hp/1000).toFixed(1)+'K' : String(hp);
    ctx.font=`bold ${label.length>5?56:72}px Arial`;
    ctx.fillStyle='#fff'; ctx.shadowColor='rgba(0,0,0,.7)'; ctx.shadowBlur=8;
    ctx.fillText(label, cx, cy+12);
    ctx.shadowBlur=0;
    const t=new THREE.CanvasTexture(cv);
    t.anisotropy=renderer.capabilities.getMaxAnisotropy();
    return t;
}

function makeStoneSideTex(){
    const W=256, H=256;
    const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
    const ctx=cv.getContext('2d');
    // Stone gradient
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#B8A070'); g.addColorStop(0.5,'#8A7050'); g.addColorStop(1,'#6A5030');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    // Horizontal mortar lines
    ctx.strokeStyle='rgba(0,0,0,.25)'; ctx.lineWidth=3;
    for(let y=32;y<H;y+=32){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
    // Vertical brick joints staggered
    for(let row=0;row<H/32;row++){
        const offset=row%2===0?0:42;
        for(let x=offset;x<W+42;x+=84){
            ctx.beginPath(); ctx.moveTo(x,row*32); ctx.lineTo(x,(row+1)*32); ctx.stroke();
        }
    }
    const t=new THREE.CanvasTexture(cv);
    t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(2,1);
    t.anisotropy=renderer.capabilities.getMaxAnisotropy();
    return t;
}

function spawnTarget(x, z, hp, sc){
    const g=new THREE.Group();

    // Height scales with row (sc)
    const h1 = 0.28 + sc*0.55;   // base tier height
    const h2 = 0.20 + sc*0.40;   // top tier height
    const platY = h1 + h2;        // surface y

    const sideTex  = makeStoneSideTex();
    const stoneMat = new THREE.MeshLambertMaterial({map:sideTex});
    const darkMat  = new THREE.MeshLambertMaterial({map:sideTex, color:0xBBAA88});
    const topMat   = new THREE.MeshLambertMaterial({map:makeTargetTopTex(hp)});
    const rimMat   = new THREE.MeshLambertMaterial({color:0xAA9966});

    // Base hex slab — top face uses gold/HP texture, sides use stone
    const base = new THREE.Mesh(new THREE.CylinderGeometry(HEX_R, HEX_R*1.06, h1, 6),
        [stoneMat, stoneMat, stoneMat]);
    base.position.y = h1/2; base.castShadow=true; base.receiveShadow=true; g.add(base);

    // Top tier — top face shows HP + coins
    const top = new THREE.Mesh(new THREE.CylinderGeometry(HEX_R*0.82, HEX_R, h2, 6),
        [darkMat, topMat, darkMat]);
    top.position.y = h1 + h2/2; top.castShadow=true; g.add(top);

    // Gold rim around top surface
    const rim = new THREE.Mesh(new THREE.TorusGeometry(HEX_R*0.83, 0.045, 4, 6), rimMat);
    rim.rotation.x = Math.PI/2; rim.position.y = platY; g.add(rim);

    // ── 3D coin pile ──
    const coinMat  = new THREE.MeshLambertMaterial({color:0xFFD700});
    const coinEdge = new THREE.MeshLambertMaterial({color:0xBB8800});
    const cR = 0.11 + sc*0.04, cH = 0.052 + sc*0.012;
    const coinGeo = new THREE.CylinderGeometry(cR, cR, cH, 12);

    // Scattered base layer
    const scatter=[
        [ 0.28, 0,     0.10], [-0.30, 0,  0.15], [ 0.10, 0, -0.28],
        [-0.18, 0,    -0.22], [ 0.32, 0, -0.12], [-0.08, 0,  0.32],
        [ 0.22, 0,     0.28], [-0.26, 0, -0.08],
    ];
    for(const [cx,,cz] of scatter){
        const coin=new THREE.Mesh(coinGeo,[coinEdge,coinMat,coinEdge]);
        coin.position.set(cx*HEX_R*1.1, platY+cH/2, cz*HEX_R*1.1);
        coin.rotation.y=Math.random()*Math.PI;
        coin.rotation.z=(Math.random()-.5)*0.6;
        coin.castShadow=true; g.add(coin);
    }
    // Central upright stack
    const stackH = 4 + Math.floor(sc*3);
    for(let i=0;i<stackH;i++){
        const coin=new THREE.Mesh(coinGeo,[coinEdge,coinMat,coinEdge]);
        coin.position.set((Math.random()-.5)*0.06, platY + cH*(i+0.5), (Math.random()-.5)*0.06);
        coin.rotation.y=Math.random()*Math.PI;
        coin.castShadow=true; g.add(coin);
    }
    // Second smaller stack
    for(let i=0;i<Math.max(2,stackH-2);i++){
        const coin=new THREE.Mesh(coinGeo,[coinEdge,coinMat,coinEdge]);
        coin.position.set(0.22*HEX_R, platY+cH*(i+0.5), 0.18*HEX_R);
        coin.rotation.y=Math.random()*Math.PI; coin.castShadow=true; g.add(coin);
    }

    // ── HP bar ──
    const hpCv=document.createElement('canvas'); hpCv.width=128; hpCv.height=18;
    const hpCtx=hpCv.getContext('2d');
    const hpTex=new THREE.CanvasTexture(hpCv);
    const hpSpr=new THREE.Sprite(new THREE.SpriteMaterial({map:hpTex,depthTest:false,transparent:true}));
    hpSpr.position.set(0, platY + cH*(stackH+1) + 0.28, 0);
    hpSpr.scale.set(1.8, 0.22, 1);
    g.add(hpSpr);

    g.position.set(x,0,z); scene.add(g);
    const e={g,mat:stoneMat,hpCv,hpCtx,hpTex,hpSpr,
        maxHp:hp,hp,spd:0,col:0xFFD700,dead:false,deadT:0,removed:false,
        hitT:0,atkT:Infinity,walkT:0,reward:Math.ceil(hp)*coinsX,isTarget:true};
    drawEHP(e); enemies.push(e);
}

function drawEHP(e){
    const c=e.hpCv,x=e.hpCtx; c.width=128;
    x.fillStyle='#222'; x.fillRect(0,3,128,12);
    const r=Math.max(0,e.hp/e.maxHp);
    x.fillStyle=r>.5?'#33cc33':r>.25?'#ffaa00':'#ff3333';
    x.fillRect(1,4,126*r,10); e.hpTex.needsUpdate=true;
}

// 3 columns × 15 rows, each row 3× HP, no gaps between platforms
function spawnWave(){
    const ROWS=15, COLS=3;
    const colSpacing = HEX_R * 2;             // columns touch side-to-side
    const rowSpacing = HEX_R * Math.sqrt(3);  // hex flat-to-flat depth
    const colX = [-colSpacing, 0, colSpacing];
    for(let r=0;r<ROWS;r++){
        const hp = Math.max(1, Math.round(level * Math.pow(3, r)));
        const sc = Math.min(0.4 + r*0.15, 2.4);
        for(let c=0;c<COLS;c++){
            spawnTarget(colX[c], pz + 10 + r*rowSpacing, hp, sc);
        }
    }
}

// ─── UPDATE ───
const _v3=new THREE.Vector3();
let lastT=0;

function tick(dt){
    // Timers
    if(effPopT>0){
        effPopT-=dt;
        if(effPopT<=0) document.getElementById('effect-pop').style.opacity='0';
    }
    gunFlash=Math.max(0,gunFlash-dt*10);
    if(plyGrp) for(const c of plyGrp.children) if(c.userData && c.userData.flash) c.material.opacity=gunFlash>.1?.9:0;

    if(GS==='RUN') tickRun(dt);
    else if(GS==='COMBAT') tickCombat(dt);
}

function tickRun(dt){
    // Horizontal input
    const left  = keys['ArrowLeft'] ||keys['KeyA'];
    const right = keys['ArrowRight']||keys['KeyD'];
    if(left)  pvx = Math.min(pvx + X_ACCEL*dt, spd*0.6);
    else if(right) pvx = Math.max(pvx - X_ACCEL*dt, -spd*0.6);
    else       pvx *= (1 - dt*14);
    px = Math.max(-X_LIMIT, Math.min(X_LIMIT, px + pvx*dt));

    // Move forward
    pz += spd * dt;

    // Gun bob anim
    plyWalkT += dt*6;
    if(plyGrp){
        const bob = Math.sin(plyWalkT)*.055;
        const sway = Math.sin(plyWalkT*.5)*.03;
        plyGrp.position.set(px + .18, 1.05 + bob, pz + .6);
        plyGrp.rotation.y = sway;
    }

    // Camera smooth follow (closer)
    camPx += (px - camPx) * Math.min(1, dt*8);
    camPz += (pz - 4 - camPz) * Math.min(1, dt*6);
    cam.position.set(camPx, 3.4, camPz);
    cam.lookAt(camPx*.4+px*.6, 1.0, pz+6);

    // Auto-fire while running
    runFireT = Math.max(0, runFireT - dt);
    if(runFireT <= 0){ runFireT = effCD(); fireBulletRun(); }
    updateBullets(dt);

    // Gate collision + cleanup
    for(const gate of gates){
        if(gate.removed) continue;
        gate.coolL=Math.max(0,gate.coolL-dt);
        gate.coolR=Math.max(0,gate.coolR-dt);

        // Player walks through gate zone
        if(!gate.passed && pz > gate.z-1.0 && pz < gate.z+1.8){
            if(px < 0 && gate.coolL<=0){
                gate.coolL=0.45; gate.hitsL++;
                const dyn=updateGatePanel(gate,'L');
                applyEff(dyn);
            }
            if(px >= 0 && gate.coolR<=0){
                gate.coolR=0.45; gate.hitsR++;
                const dyn=updateGatePanel(gate,'R');
                applyEff(dyn);
            }
        }

        // Remove gate instantly as soon as player exits the zone
        if(!gate.removed && pz > gate.z+1.8){
            gate.passed=true;
            gate.removed=true;
            gate.meshes.forEach(m=>gateGrp.remove(m));
        }
    }

    // Update mobs + player collision
    for(const m of mobs){
        if(m.removed) continue;
        if(m.dead){
            m.deadT+=dt;
            if(m.deadT<0.5){
                m.g.rotation.z=m.deadT*5;
                m.g.position.y=-m.deadT*1.8;
                m.hpSpr.visible=false;
            } else { scene.remove(m.g); m.removed=true; }
            continue;
        }
        // Idle bounce + arm swing
        m.idleT+=dt*1.8;
        m.g.children[6] && (m.g.children[6].rotation.z = -0.4+Math.sin(m.idleT)*0.25); // club sway
        if(m.hitT>0) m.hitT-=dt;
        // Player collides with mob → game over
        if(Math.abs(pz-m.g.position.z)<0.55 && Math.abs(px-m.g.position.x)<0.45){
            playerDie(); return;
        }
    }

    // Combat zone — spawn targets, keep running
    if(pz >= COMBAT_DIST && !winTriggered){
        winTriggered=true;
        GS='COMBAT';
        spawnWave();
    }
}

function tickCombat(dt){
    // Same horizontal steering as run phase
    const left  = keys['ArrowLeft'] ||keys['KeyA'];
    const right = keys['ArrowRight']||keys['KeyD'];
    if(left)  pvx=Math.min(pvx+X_ACCEL*dt, spd*0.6);
    else if(right) pvx=Math.max(pvx-X_ACCEL*dt,-spd*0.6);
    else pvx*=(1-dt*14);
    px=Math.max(-X_LIMIT,Math.min(X_LIMIT,px+pvx*dt));

    // Weapon keeps moving forward
    pz += spd * dt;
    plyWalkT += dt*6;
    const bob = Math.sin(plyWalkT)*.055;
    const sway = Math.sin(plyWalkT*.5)*.03;
    if(plyGrp){ plyGrp.position.set(px+.18, 1.05+bob, pz+.6); plyGrp.rotation.y=sway; }

    camPx+=(px-camPx)*Math.min(1,dt*8);
    camPz+=(pz-4-camPz)*Math.min(1,dt*6);
    cam.position.set(camPx, 3.4, camPz);
    cam.lookAt(camPx*.4+px*.6, 1.0, pz+6);

    // Auto-fire bullets (same timer as run phase)
    runFireT=Math.max(0,runFireT-dt);
    if(runFireT<=0){ runFireT=effCD(); fireBulletRun(); }
    updateBullets(dt);

    // Level ends when weapon collides with any target
    if(!shopOpened){
        for(const e of enemies){
            if(e.removed||e.dead) continue;
            const dz = e.g.position.z - pz;
            const dx = Math.abs(e.g.position.x - px);
            if(dz <= HEX_R && dz >= -0.4 && dx < HEX_R*1.8){
                shopOpened=true;
                openShop();
                break;
            }
        }
    }

    // Update targets
    for(const e of enemies){
        if(e.removed) continue;
        if(e.dead){
            e.deadT+=dt;
            if(e.deadT<.4){
                e.g.rotation.z=e.deadT*4;
                e.g.position.y=-e.deadT*1.5;
                e.hpSpr.visible=false;
            } else { scene.remove(e.g); e.removed=true; }
            continue;
        }
        if(e.hitT>0){ e.hitT-=dt; }
    }

}

// ─── RENDER LOOP ───
function frame(ts){
    const dt=Math.min((ts-lastT)/1000,.05); lastT=ts;
    if(GS==='RUN'||GS==='COMBAT') tick(dt);
    renderer.clear();
    renderer.render(scene,cam);
    requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
